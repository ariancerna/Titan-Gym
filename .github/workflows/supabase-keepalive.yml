# El plan gratuito de Supabase pausa el proyecto tras 7 días sin actividad.
# Esta tarea consulta el catálogo público cada 3 días para mantenerlo activo.
# Solo lectura: usa la clave pública (la misma que ya está en la web) y no toca datos personales.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 13 */3 * *' # 08:00 en Lima, cada 3 días
  workflow_dispatch: # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar el catálogo de clases
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Faltan los secretos SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY del repositorio." >&2
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/list_sessions" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Respuesta de Supabase: HTTP $status"
          test "$status" = "200"
