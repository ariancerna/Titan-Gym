# HU07: recordatorio por correo 3 horas antes de cada clase reservada.
# El disparador principal es Supabase (pg_cron llama a workflow_dispatch cada 10 minutos, ver
# docs/RECORDATORIOS.md): GitHub retrasa o salta el cron propio, a veces durante horas. El cron
# de abajo queda solo como respaldo. Cada reserva se marca al enviarse, así que no hay duplicados.
name: Recordatorios de clases

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Prueba en seco: solo cuenta los pendientes, sin enviar'
        type: boolean
        default: true

concurrency:
  group: recordatorios
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Solo las dependencias de producción, sin scripts de instalación (no hace falta Playwright).
      - run: npm ci --omit=dev --ignore-scripts
      - name: Enviar recordatorios
        # Desde la web el valor llega como booleano y desde la API como texto ("false").
        run: node tools/send-reminders.mjs ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run == true || inputs.dry_run == 'true') && '--dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
